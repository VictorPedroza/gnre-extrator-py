[system]
# Nome do sistema exibido nos logs
name = GNRE ERP Senior Processor
version = 1.0.0
log_level = INFO

[paths]
# Caminhos relativos à raiz do projeto (não altere salvo necessidade)
entrada = data/entrada
saida   = data/saida
backup  = data/backup
temp    = data/temp
logs    = logs

[processing]
# Mover o PDF para backup após processar com sucesso?
backup_after_process = true

# Mover o PDF para pasta de erros se falhar?
move_on_error = true

# Extensões aceitas na pasta de entrada
extensions = .pdf

[csv]
# Separador do CSV de saída (Senior usa ponto e vírgula)
delimiter = ;

# Encoding do arquivo CSV
encoding = utf-8-sig

# Nome base do arquivo de saída (a data será adicionada automaticamente)
output_prefix = importacao_senior

[erp]
# Transação fixa no ERP para todos os títulos
transacao = GNRE

# Situação padrão dos títulos importados (A = Aberto)
situacao = A

# Forma de pagamento padrão (deixe vazio para preencher manualmente)
forma_pagamento =

# Natureza padrão (deixe vazio para preencher manualmente)
natureza =
